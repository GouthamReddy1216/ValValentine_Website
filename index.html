<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Nirali...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hearts-container"></div>

    <div class="card" id="question-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnJ5ZnR6Z2c3ZnR6Z2c3ZnR6Z2c3ZnR6Z2c3ZnR6Z2c3ZnR6Z2cvMTBpdGgzeGgzeGgzeGgzeGcvZ2lwaHkuZ2lm/3oz8xSAjM33HwYl3W0/giphy.gif" alt="Cute asking bear" class="mascot">
        
        <h1>Nirali, will you be my Valentine?</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="acceptLove()">Yes 💖</button>
            <div id="noBtnContainer">
                <button id="noBtn">No</button>
            </div>
        </div>

        <p class="subtext">The "No" button seems a bit slippery... 😈</p>
    </div>

    <div class="card hidden" id="success-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExY2N0Y2N0Y2N0Y2N0Y2N0Y2N0Y2N0Y2N0Y2N0Y2N0Y2N0Y2N0Yy9QRW5qTlgxeWl3aXdpd2l3aXcvZ2lwaHkuZ2lm/GeimqsBk0tIf5zdD7C/giphy.gif" alt="Happy dancing cat" class="mascot happiness">
        
        <h1>YAYYYY! Best Day Ever! ❤️</h1>
        <p>I knew you'd say yes! See you soon! xx</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
