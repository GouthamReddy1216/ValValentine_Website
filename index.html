<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Nirali...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hearts-container"></div>

    <div class="card" id="question-container">
            <img src="ask.gif" alt="Cute asking bear" class="mascot">        
        <h1>Riya, will you be my Valentine?</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="acceptLove()">Yes 💖</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="card hidden" id="success-container">
        <img src="yes.gif" alt="Happy dancing cat" class="mascot happiness">        
        <h1>YAYYYY! Best Day Ever! ❤️</h1>
        <p>I knew you'd say yes! See you soon! XO</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
